name: CI

# Runs on PRs and on pushes to main. The three blocking jobs (typecheck, test,
# build) are the same commands used locally and gate merges once the orchestrator
# turns on branch protection.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No .nvmrc / package.json engines in the repo → pin the current Node LTS.
      # 22.x (Jod) covers the Next 16 / React 19 / tsx toolchain.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Blocking gates (must pass to merge) ---
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # --- Lint gate (blocking) ---
      # Baseline cleared in cycle 21 (issue #11): public/pdf.worker.min.mjs (a
      # vendored, minified bundle) is eslint-ignored and every real error is
      # fixed, so lint now gates merges at 0 errors. Warnings remain allowed.
      - name: Lint
        run: npm run lint
