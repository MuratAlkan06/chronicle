name: CI

# Runs on PRs and on pushes to main. The five blocking steps (typecheck, test,
# build, lint, contrast) are the same commands used locally and gate merges via
# branch protection, which requires a status check named `verify` — so the job
# name below must not be renamed.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No .nvmrc / package.json engines in the repo → pin the current Node LTS.
      # 22.x (Jod) covers the Next 16 / React 19 / tsx toolchain.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- Blocking gates (must pass to merge) ---
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # --- Lint gate (blocking) ---
      # Baseline cleared in cycle 21 (issue #11): public/pdf.worker.min.mjs (a
      # vendored, minified bundle) is eslint-ignored and every real error is
      # fixed, so lint now gates merges at 0 errors. Warnings remain allowed.
      - name: Lint
        run: npm run lint

      # --- Contrast gate (blocking) ---
      # Added in cycle 23 (issue #16): the ink tokens in app/globals.css are the
      # 9-12px micro-label colours, so a regression there is a WCAG 2.x AA
      # failure that no other gate can see. The script parses the hexes out of
      # the stylesheet and exits 1 if any ink token drops below 4.5:1 on either
      # page background. Not part of `npm test` (that runs lib/*.test.ts only).
      - name: Contrast check (WCAG AA)
        run: npx tsx scripts/check-contrast.ts
